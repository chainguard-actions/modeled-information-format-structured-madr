name: Test strict mode with valid ADR passes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/valid-adrs
          pattern: "**/*.md"
          strict: "true"
          fail-on-error: "true"

      - name: Assert valid is true in strict mode with compliant ADR
        env:
          ACTUAL: ${{ steps.action.outputs.valid }}
        run: |
          echo "actual valid: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected valid=true in strict mode with compliant ADR, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: valid=true"

      - name: Assert warnings count is reported
        env:
          ACTUAL: ${{ steps.action.outputs.warnings }}
        run: |
          echo "actual warnings: $ACTUAL"
          # In strict mode with a fully compliant ADR, warnings should be 0
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected warnings=0 for fully compliant ADR in strict mode, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: warnings=0"

      - name: Assert total is 1
        env:
          ACTUAL: ${{ steps.action.outputs.total }}
        run: |
          echo "actual total: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected total=1, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: total=1"
