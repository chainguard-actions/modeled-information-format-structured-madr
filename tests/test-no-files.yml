name: Test no ADR files found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/does-not-exist
      - name: Assert zero totals
        env:
          VALID: ${{ steps.action.outputs.valid }}
          TOTAL: ${{ steps.action.outputs.total }}
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          WARNINGS: ${{ steps.action.outputs.warnings }}
        run: |
          echo "valid=$VALID total=$TOTAL passed=$PASSED failed=$FAILED warnings=$WARNINGS"
          [ "$VALID" = "true" ] || { echo "FAIL: valid should be true"; exit 1; }
          [ "$TOTAL" = "0" ] || { echo "FAIL: total should be 0"; exit 1; }
          [ "$PASSED" = "0" ] || { echo "FAIL: passed should be 0"; exit 1; }
          [ "$FAILED" = "0" ] || { echo "FAIL: failed should be 0"; exit 1; }
          [ "$WARNINGS" = "0" ] || { echo "FAIL: warnings should be 0"; exit 1; }
          echo "PASS"
