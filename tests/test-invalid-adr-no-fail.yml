name: Test invalid ADR with fail-on-error false
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/invalid-docs/decisions
          pattern: "**/*.md"
          fail-on-error: "false"

      - name: Assert valid output is false
        env:
          ACTUAL: ${{ steps.action.outputs.valid }}
        run: |
          echo "actual valid: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected valid=false, got $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert total count
        env:
          ACTUAL: ${{ steps.action.outputs.total }}
        run: |
          echo "actual total: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected total=1, got $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert failed count is nonzero
        env:
          ACTUAL: ${{ steps.action.outputs.failed }}
        run: |
          echo "actual failed: $ACTUAL"
          if [ "$ACTUAL" = "0" ]; then
            echo "FAIL: expected failed>0, got $ACTUAL"
            exit 1
          fi
          echo "PASS"
