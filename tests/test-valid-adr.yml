name: Test valid ADR passes validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/valid-adrs
          pattern: "**/*.md"
          fail-on-error: "true"

      - name: Assert valid is true
        env:
          ACTUAL: ${{ steps.action.outputs.valid }}
        run: |
          echo "actual valid: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected valid=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: valid=true"

      - name: Assert total is 1
        env:
          ACTUAL: ${{ steps.action.outputs.total }}
        run: |
          echo "actual total: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected total=1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: total=1"

      - name: Assert passed is 1
        env:
          ACTUAL: ${{ steps.action.outputs.passed }}
        run: |
          echo "actual passed: $ACTUAL"
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected passed=1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: passed=1"

      - name: Assert failed is 0
        env:
          ACTUAL: ${{ steps.action.outputs.failed }}
        run: |
          echo "actual failed: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected failed=0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: failed=0"
